        must be a member of `groupId`. `purpose=response` requires the cycle to
        be `open` and counts toward the 10-images-per-answer cap;
        `purpose=comment` requires it to be `published`. The client PUTs the
        bytes to `uploadUrl` with every header in `headers`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
            example:
              groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
              cycleId: "202606"
              questionId: "018f2b6b-6c1b-7c3a-9d4e-3c4d5e6f7a8b"
              purpose: "response"
              mimeType: "image/jpeg"
              byteSize: 4823920
              sha256: "n4bQgYhMfWWaL+qgxVrQFaO/TxsrC4Is0V1sFbDwCgg="
      responses:
        "201":
          description: The presigned upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadResponse"
              example:
                imageId: "018f2b6b-6c1b-7c3a-9d4e-4d5e6f7a8b9c"
                uploadUrl: "https://opennewsletter-media-originals-dev-123456789012.s3.us-east-1.amazonaws.com/uploads/018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a/202606/018f2b6b-6c1b-7c3a-9d4e-3c4d5e6f7a8b/018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f/018f2b6b-6c1b-7c3a-9d4e-4d5e6f7a8b9c.jpg?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Signature=abc"
                headers:
                  content-type: "image/jpeg"
                  x-amz-checksum-sha256: "n4bQgYhMfWWaL+qgxVrQFaO/TxsrC4Is0V1sFbDwCgg="
                expiresInSeconds: 600
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/ImageTooLarge"
        "415":
          $ref: "#/components/responses/ImageBadType"
        "422":
          $ref: "#/components/responses/ValidationFailed"

