  /media-cookie:
    get:
      operationId: getMediaCookie
      tags: [media]
      summary: >
        CloudFront signed-cookie values scoped to `/img/{groupId}/*`, valid for
        one hour (`03-api-contract.md` §9.5, `08-media-uploads.md` §4). When the
        Lambda has a cookie domain configured (prod) the response also carries
        three `Set-Cookie` headers (`CloudFront-Policy`, `CloudFront-Signature`,
        `CloudFront-Key-Pair-Id`); the client must call this with
        `credentials: "include"`. Dev has no shared registrable domain, so the
        SPA appends the body values as signed-URL query parameters instead
        (`08-media-uploads.md` §4.5). Caller must be a member of `groupId`.
      parameters:
        - $ref: "#/components/parameters/GroupIdQuery"
      responses:
        "200":
          description: The signed policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaCookieResponse"
              example:
                policy: "eyJTdGF0ZW1lbnQiOlt7IlJlc291cmNlIjoiaHR0cHM6Ly9jZG4ub3Blbm5ld3NsZXR0ZXIuZXhhbXBsZS5jb20vaW1nLzAxOGYyYjZiLyoifV19"
                signature: "Nql641NHEUkUaXQHZINK1FZ~SYeUSoBJMxjdgqrzIdzV2gyEXPDNv0pYdWJkflDKJ3xIu7lbwRpSkG98NBlgPi4ZJpRRnVX4kXAJK6tdNx6FucDB7OVqzcxkxHsGFd8VCG1BkC-Afh9~lOCMIYHIaiOB6~TF-ZFfi5a4FE9cDZ_"
                keyPairId: "K2JCJMDEHXQW5F"
                expiresAt: "2026-06-02T11:00:00Z"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /avatars:
    post:
      operationId: createAvatar
      tags: [media]
      summary: >
        Request a presigned S3 PUT URL for a new avatar (`03-api-contract.md`
        §9.7). JPEG, PNG or WebP, at most 5 MB. Creates a `pending` AvatarMedia
        row owned by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAvatarRequest"
            example:
              mimeType: "image/png"
              byteSize: 204800
      responses:
        "201":
          description: The presigned upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAvatarResponse"
              example:
                avatarId: "018f2b6b-6c1b-7c3a-9d4e-5e6f7a8b9c0d"
                uploadUrl: "https://opennewsletter-avatars-originals-dev-123456789012.s3.us-east-1.amazonaws.com/uploads/018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f/018f2b6b-6c1b-7c3a-9d4e-5e6f7a8b9c0d.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Signature=abc"
                headers:
                  content-type: "image/png"
                expiresInSeconds: 600
        "413":
          $ref: "#/components/responses/ImageTooLarge"
        "415":
          $ref: "#/components/responses/ImageBadType"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /avatars/{avatarId}:
    get:
      operationId: getAvatar
      tags: [media]
      summary: >
        Status of one of the caller's avatars. The frontend polls until
        `status` leaves `pending`, then sends `PATCH /me` with
        `avatarMediaId`. Another user's avatar is a 404.
      parameters:
        - $ref: "#/components/parameters/AvatarIdPath"
      responses:
        "200":
          description: The avatar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarMediaResponse"
              example:
                avatarId: "018f2b6b-6c1b-7c3a-9d4e-5e6f7a8b9c0d"
                mimeType: "image/png"
                status: "ready"
                bytes: 204800
                avatarUrl: "https://cdn.opennewsletter.example.com/avatar/018f2b6b-6c1b-7c3a-9d4e-5e6f7a8b9c0d/display.webp"
                errorMessage: null
                uploadedAt: "2026-06-02T10:00:00Z"
                processedAt: "2026-06-02T10:00:01Z"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAvatar
      tags: [media]
      summary: >
        Soft-delete one of the caller's avatars (marks it `failed` with
        `errorMessage: "DELETED"`). If it is the caller's current
        `avatarMediaId`, that is cleared to `null`. Idempotent.
      parameters:
        - $ref: "#/components/parameters/AvatarIdPath"
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /push/subscribe:
    post:
      operationId: pushSubscribe
      tags: [push]
      summary: >
        Upsert the caller's push subscription for one browser endpoint, keyed
        by `(userId, sha256(endpoint))` (`07-notifications.md` §3.1). Resets
        `failureCount` to 0 and keeps the row's original `createdAt` and
        `lastSuccessAt`. `endpoint` must be an `https://` URL of at most 2048
        characters; `keys.p256dh` must base64url-decode to a 65-byte
        uncompressed P-256 point, and `keys.auth` to 16 bytes; `userAgent` is
        at most 512 characters. A user keeps at most 10 subscriptions: adding
        an 11th removes the one least recently successful (oldest `createdAt`
        when none has succeeded).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscribeRequest"
            example:
              endpoint: "https://fcm.googleapis.com/fcm/send/c1KrmpTuRm0:APA91bG"
              expirationTime: null
              keys:
                p256dh: "BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM"
                auth: "tBHItJI5svbpez7KI4CCXg"
              userAgent: "Mozilla/5.0 (Linux; Android 14; Pixel 8) Chrome/129.0"
      responses:
        "201":
          description: Subscription stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscribeResponse"
              example:
                subscriptionId: "Wk0fV7cQx8yHn2Jp3sLqT9aBcDeFgHiJkLmNoPqRsTu"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /push/unsubscribe:
    post:
      operationId: pushUnsubscribe
      tags: [push]
      summary: >
        Delete the caller's subscription for `endpoint`. Idempotent: 204 even
        if no such row exists. Also used by the Settings "My devices" remove
        button, which passes the `endpoint` from `GET /push/subscriptions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeRequest"
            example:
              endpoint: "https://fcm.googleapis.com/fcm/send/c1KrmpTuRm0:APA91bG"
      responses:
        "204":
          description: Deleted (or already absent).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /push/subscriptions:
    get:
      operationId: listPushSubscriptions
      tags: [push]
      summary: >
        The caller's push subscriptions, most recently created first. The
        encryption keys are never returned; `endpoint` is, so the client can
        tell which row is the current browser.
      responses:
        "200":
          description: The caller's subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionListResponse"
              example:
                items:
                  - subscriptionId: "Wk0fV7cQx8yHn2Jp3sLqT9aBcDeFgHiJkLmNoPqRsTu"
                    endpoint: "https://fcm.googleapis.com/fcm/send/c1KrmpTuRm0:APA91bG"
                    userAgent: "Mozilla/5.0 (Linux; Android 14; Pixel 8) Chrome/129.0"
                    createdAt: "2026-10-05T14:00:00Z"
                    lastSuccessAt: "2026-10-05T14:01:00Z"
                    failureCount: 0
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /push/test:
    post:
      operationId: sendTestPush
      tags: [push]
      summary: >
        Send a `kind: test` push to every one of the caller's subscriptions
        (`07-notifications.md` §9). No request body. Each result is
        `delivered`, `expired` (the push service answered 404/410, and the
        subscription has been deleted) or `failed` (anything else; the
        subscription's `failureCount` is incremented, and it is deleted at 5).
        `statusCode` is the push service's HTTP status, or null for a network
        error. A caller with no subscriptions gets an empty list.
      responses:
        "200":
          description: Per-subscription delivery results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTestResponse"
              example:
                results:
                  - subscriptionId: "Wk0fV7cQx8yHn2Jp3sLqT9aBcDeFgHiJkLmNoPqRsTu"
                    userAgent: "Mozilla/5.0 (Linux; Android 14; Pixel 8) Chrome/129.0"
                    outcome: "delivered"
                    statusCode: 201
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /push/preferences:
    get:
      operationId: listPushPreferences
      tags: [push]
      summary: >
        The caller's notification preferences, one entry per group they
        belong to, in `GET /config` membership order. Groups with no stored
        `NotificationPref` row report the defaults (both true). Added M11:
        `03` §10 only had the PUT, which left Settings no way to read state.
      responses:
        "200":
          description: One preference per membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPreferenceListResponse"
              example:
                items:
                  - groupId: "01HG2F3K4M5N6P7Q8R9S0T1V2W"
                    cycleOpen: true
                    deadlineReminders: false
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /push/preferences/{groupId}:
    put:
      operationId: putPushPreference
      tags: [push]
      summary: >
        Upsert the caller's `NotificationPref` for one group. Both fields are
        required. Unknown fields, including `publication` (publication pushes
        are always on), are a 422. The caller must be a member of the group,
        otherwise 403.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutPushPreferenceRequest"
            example:
              cycleOpen: true
              deadlineReminders: false
      responses:
        "200":
          description: The stored preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPreferenceResponse"
              example:
                groupId: "01HG2F3K4M5N6P7Q8R9S0T1V2W"
                cycleOpen: true
                deadlineReminders: false
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness check. Requires auth, per the idle-backend principle.
      responses:
        "200":
          description: >
            OK, with the build's git SHA and timestamp. A locally built binary
            reports `version: "unknown"` and `buildAt: null`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                version: "161cb16"
                buildAt: "2026-09-27T18:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Cognito ID token (`Authorization: Bearer {idToken}`), per `03-api-contract.md` §1."

  parameters:
    GroupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        type: string
      example: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
      example: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
    CycleIdPath:
      name: cycleId
      in: path
      required: true
      schema:
        type: string
      example: "202606"
    QuestionIdPath:
      name: questionId
      in: path
      required: true
      schema:
        type: string
      example: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
    ImageIdPath:
      name: imageId
      in: path
      required: true
      schema:
        type: string
      example: "018f2b6b-6c1b-7c3a-9d4e-4d5e6f7a8b9c"
    AvatarIdPath:
      name: avatarId
      in: path
      required: true
      schema:
        type: string
      example: "018f2b6b-6c1b-7c3a-9d4e-5e6f7a8b9c0d"
    ResponseIdPath:
      name: responseId
      in: path
      required: true
      schema:
        type: string
      example: "018f2b6b-6c1b-7c3a-9d4e-4d5e6f7a8b9c"
    CommentIdPath:
      name: commentId
      in: path
      required: true
      schema:
        type: string
      example: "018f2b6b-6c1b-7c3a-9d4e-9c0d1e2f3a4b"
    EmojiPath:
      name: emoji
      in: path
      required: true
      description: URL-encoded emoji (`09-engagement.md` §2.2).
      schema:
        type: string
      example: "%F0%9F%94%A5"
    GroupIdQuery:
      name: groupId
      in: query
      required: true
      schema:
        type: string
      example: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
    CycleIdQuery:
      name: cycleId
      in: query
      required: true
      description: >
        Required with `groupId` because an ImageMedia row is keyed by
        `(groupId, cycleId, imageId)` (`02-data-model-dynamodb.md` §2.10).
      schema:
        type: string
      example: "202606"
    NewsletterStatusQuery:
      name: status
      in: query
      required: false
      description: Filter to newsletters in this status. Omit for all statuses.
      schema:
        type: string
        enum: [voting, open, published]
    CandidateSortQuery:
      name: sort
      in: query
      required: false
      description: "`top` (default) ranks by vote count; `recent` orders by `submittedAt` descending."
      schema:
        type: string
        enum: [top, recent]
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Page size, 1-100 (`03-api-contract.md` §1). Some routes cap this lower — see their description.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque pagination token from a previous page's `nextCursor`.
      schema:
        type: string

  responses:
    Unauthenticated:
      description: No/invalid JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Authenticated but not authorized for this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Resource missing or not visible to caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://api.opennewsletter.example.com/errors/not-found"
            title: "Not found"
            status: 404
            detail: "group not found"
            code: "NOT_FOUND"
            correlationId: "01952f3e-6c1b-7c3a-9d4e-4d5e6f7a8b9c"
    ValidationFailed:
      description: Body/query failed schema validation; see `fieldErrors`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://api.opennewsletter.example.com/errors/validation-failed"
            title: "Validation failed"
            status: 422
            detail: "displayName must be at most 40 characters"
            code: "VALIDATION_FAILED"
            correlationId: "01952f3e-6c1b-7c3a-9d4e-4d5e6f7a8b9c"
            fieldErrors:
              - field: "displayName"
                code: "TOO_LONG"
                message: "displayName must be at most 40 characters"
    Conflict:
      description: >
        State conflict — one of `INVITE_CONSUMED`, `MEMBER_CAP_REACHED`,
        `LAST_ADMIN`, `VOTE_CAP_REACHED`, `CYCLE_NOT_VOTING`, `CYCLE_NOT_OPEN`,
        `CYCLE_NOT_PUBLISHED`, `IMAGE_LIMIT_EXCEEDED`, `IMAGE_IN_USE`, or
        `CANDIDATE_PROMOTED`
        (`03-api-contract.md` §1.1).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InviteInvalid:
      description: Invite code is unknown.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InviteExpired:
      description: Invite code is past its `expiresAt`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ImageTooLarge:
      description: "`IMAGE_TOO_LARGE` — declared `byteSize` is over the cap."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ImageBadType:
      description: "`IMAGE_BAD_TYPE` — `mimeType` is not in the allowed set."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NewsletterArchived:
      description: >
        The cycle has transitioned to `archived` (`NEWSLETTER_ARCHIVED`); see
        `10-archival.md` for the (deferred) archive-link behavior.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    # ---- Shared enums (canonical home per 03-api-contract.md §2.3/§4.3) ----

    Role:
      type: string
      enum: [admin, member]

    InviteStatus:
      type: string
      enum: [pending, consumed, revoked]

    GradientSlug:
      type: string
      description: >
        Preset group gradient palette slugs. Mirrored in
        `backend/crates/shared/src/config.rs::GRADIENT_SLUGS` and the frontend
        palette table; the contract test asserts the two stay identical.
      enum:
        - grape-sky
        - ember-rose
        - forest-mint
        - ocean-dusk
        - citrus-blush
        - slate-lilac

    AvatarColorSlug:
      type: string
      description: >
        Fallback avatar colour slugs. Mirrored in
        `backend/crates/shared/src/config.rs::AVATAR_COLOR_SLUGS` and the frontend
        palette table; the contract test asserts the two stay identical.
      enum:
        - red
        - orange
        - amber
        - green
        - teal
        - blue
        - violet
        - pink

    # ---- §1.1 RFC-7807 error shape ----

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    ProblemDetails:
      type: object
      required: [type, title, status, detail, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Machine-readable code from the `03-api-contract.md` §1.1 catalog.
        correlationId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    # ---- §2 Bootstrap / metadata ----

    MembershipSummary:
      type: object
      required: [groupId, role, groupName, timezone, gradient]
      properties:
        groupId:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        groupName:
          type: string
        timezone:
          type: string
          description: The group's IANA timezone, for labelling cycles client-side (`04` §14a).
        gradient:
          $ref: "#/components/schemas/GradientSlug"

    ConfigResponse:
      type: object
      required: [userId, email, displayName, vapidPublicKey, groupDefaults, memberships]
      properties:
        userId:
          type: [string, "null"]
        email:
          type: [string, "null"]
        displayName:
          type: [string, "null"]
        vapidPublicKey:
          type: string
        groupDefaults:
          type: object
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipSummary"

    UserResponse:
      type: object
      required: [userId, email, displayName, avatarColor, avatarMediaId, avatarUrl, createdAt]
      properties:
        userId:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatarColor:
          $ref: "#/components/schemas/AvatarColorSlug"
        avatarMediaId:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    PatchMeRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
        avatarColor:
          $ref: "#/components/schemas/AvatarColorSlug"
        avatarMediaId:
          description: Absent leaves the photo alone; an explicit `null` clears it.
          type: [string, "null"]

    # ---- §3 Invite & membership routes ----

    CreateInviteRequest:
      type: object
      additionalProperties: false
      required: [groupId, roleOnRedeem]
      properties:
        groupId:
          type: string
        ttlDays:
          type: integer
          description: Defaults to the group's invite TTL setting when omitted.
        roleOnRedeem:
          $ref: "#/components/schemas/Role"

    CreateInviteResponse:
      type: object
      required: [code, groupId, expiresAt, roleOnRedeem]
      properties:
        code:
          type: string
        groupId:
          type: string
        expiresAt:
          type: string
          format: date-time
        roleOnRedeem:
          $ref: "#/components/schemas/Role"

    InviteSummary:
      type: object
      required:
        - code
        - groupId
        - status
        - roleOnRedeem
        - createdBy
        - createdAt
        - expiresAt
        - consumedBy
        - consumedAt
      properties:
        code:
          type: string
        groupId:
          type: string
        status:
          $ref: "#/components/schemas/InviteStatus"
        roleOnRedeem:
          $ref: "#/components/schemas/Role"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        consumedBy:
          type: [string, "null"]
        consumedAt:
          type: [string, "null"]
          format: date-time

    InviteListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InviteSummary"
        nextCursor:
          type: [string, "null"]

    RedeemRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string

    RedeemResponse:
      type: object
      required: [groupId, groupName, role]
      properties:
        groupId:
          type: string
        groupName:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    # ---- §4 Group routes ----

    MembershipListResponse:
      type: object
      required: [memberships]
      properties:
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipSummary"

    MemberResponse:
      type: object
      required: [userId, displayName, role, avatarColor, avatarUrl, joinedAt, editionsAnswered]
      properties:
        userId:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        avatarColor:
          $ref: "#/components/schemas/AvatarColorSlug"
        avatarUrl:
          type: [string, "null"]
        joinedAt:
          type: string
          format: date-time
        editionsAnswered:
          type: integer

    CycleSettingsResponse:
      type: object
      required: [questionsPerCycle, votesPerUserPerCycle, responseWindowDays]
      properties:
        questionsPerCycle:
          type: integer
        votesPerUserPerCycle:
          type: integer
        responseWindowDays:
          type: integer

    NotificationSettingsResponse:
      type: object
      required: [offsetsHoursBeforeClose, onCycleOpen]
      properties:
        offsetsHoursBeforeClose:
          type: array
          items:
            type: integer
        onCycleOpen:
          type: boolean

    GroupResponse:
      type: object
      required:
        - groupId
        - name
        - timezone
        - gradient
        - cycleSettings
        - notificationSettings
        - memberCount
        - memberSoftCap
        - createdAt
        - members
      properties:
        groupId:
          type: string
        name:
          type: string
        timezone:
          type: string
        gradient:
          $ref: "#/components/schemas/GradientSlug"
        cycleSettings:
          $ref: "#/components/schemas/CycleSettingsResponse"
        notificationSettings:
          $ref: "#/components/schemas/NotificationSettingsResponse"
        memberCount:
          type: integer
        memberSoftCap:
          type: integer
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberResponse"

    CycleSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        questionsPerCycle:
          type: integer
        votesPerUserPerCycle:
          type: integer
        responseWindowDays:
          type: integer

    NotificationSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        offsetsHoursBeforeClose:
          type: array
          items:
            type: integer
        onCycleOpen:
          type: boolean

    PatchGroupRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        timezone:
          type: string
        gradient:
          $ref: "#/components/schemas/GradientSlug"
        cycleSettings:
          $ref: "#/components/schemas/CycleSettingsPatch"
        notificationSettings:
          $ref: "#/components/schemas/NotificationSettingsPatch"
        memberSoftCap:
          type: integer

    PatchMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    # ---- §5/§6 Newsletter and candidate-question routes ----

    QuestionKind:
      type: string
      enum: [text, poll]

    ResponseStatus:
      type: string
      enum: [draft, published]

    NewsletterStatus:
      type: string
      enum: [voting, open, published, archived]

    AskedBy:
      type: object
      required: [userId, displayName, avatarColor, avatarUrl]
      description: >
        `null` (at the call site, not here) when `isAnonymous=true` and the
        caller is neither the submitter nor a group admin.
      properties:
        userId:
          type: string
        displayName:
          type: string
        avatarColor:
          $ref: "#/components/schemas/AvatarColorSlug"
        avatarUrl:
          type: [string, "null"]

    PollOptionResponse:
      type: object
      required: [optionId, label]
      properties:
        optionId:
          type: string
        label:
          type: string

    CandidateItemResponse:
      type: object
      required:
        - questionId
        - kind
        - prompt
        - askedBy
        - isAnonymous
        - voteCount
        - votedByMe
        - submittedAt
      properties:
        questionId:
          type: string
        kind:
          $ref: "#/components/schemas/QuestionKind"
        prompt:
          type: string
        pollOptions:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionResponse"
        askedBy:
          oneOf:
            - $ref: "#/components/schemas/AskedBy"
            - type: "null"
        isAnonymous:
          type: boolean
        voteCount:
          type: integer
        votedByMe:
          type: boolean
        submittedAt:
          type: string
          format: date-time

    CandidateListResponse:
      type: object
      required: [nextCycleId, votesPerUserPerCycle, myVoteCount, items, nextCursor]
      properties:
        nextCycleId:
          type: string
        votesPerUserPerCycle:
          type: integer
        myVoteCount:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CandidateItemResponse"
        nextCursor:
          type: [string, "null"]

    CreatePollOptionRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string

    CreateCandidateRequest:
      type: object
      additionalProperties: false
      required: [kind, prompt]
      properties:
        kind:
          $ref: "#/components/schemas/QuestionKind"
        prompt:
          type: string
        pollOptions:
          type: array
          items:
            $ref: "#/components/schemas/CreatePollOptionRequest"
        isAnonymous:
          type: boolean
          default: false
          description: Fixed at creation; hides `askedBy` from non-admin members when `true`.

    CandidateVoteResponse:
      type: object
      required: [questionId, voteCount, votedByMe, myVoteCount]
      properties:
        questionId:
          type: string
        voteCount:
          type: integer
        votedByMe:
          type: boolean
        myVoteCount:
          type: integer

    NewsletterSummary:
      type: object
      required:
        - cycleId
        - status
        - responseOpenAt
        - responseCloseAt
        - publishedAt
        - questionCount
        - myDraftCount
        - myPublishedCount
      properties:
        cycleId:
          type: string
        status:
          $ref: "#/components/schemas/NewsletterStatus"
        responseOpenAt:
          type: string
          format: date-time
        responseCloseAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time
        questionCount:
          type: integer
        myDraftCount:
          type: integer
        myPublishedCount:
          type: integer

    NewsletterListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsletterSummary"
        nextCursor:
          type: [string, "null"]

    MyResponseSummary:
      type: object
      required: [responseId, status, imageMediaIds, updatedAt, publishedAt]
      properties:
        responseId:
          type: string
        status:
          $ref: "#/components/schemas/ResponseStatus"
        body:
          type: string
        imageMediaIds:
          type: array
          items:
            type: string
        pollOptionId:
          type: string
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time

    OpenQuestionResponse:
      type: object
      required: [questionId, kind, prompt, displayOrder, askedBy, isAnonymous, myResponse]
      properties:
        questionId:
          type: string
        kind:
          $ref: "#/components/schemas/QuestionKind"
        prompt:
          type: string
        displayOrder:
          type: integer
        askedBy:
          oneOf:
            - $ref: "#/components/schemas/AskedBy"
            - type: "null"
        isAnonymous:
          type: boolean
        pollOptions:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionResponse"
        myResponse:
          oneOf:
            - $ref: "#/components/schemas/MyResponseSummary"
            - type: "null"

    PublishedImageResponse:
      type: object
      required: [imageId, displayUrl, thumbUrl, width, height]
      properties:
        imageId:
          type: string
        displayUrl:
          type: string
        thumbUrl:
          type: string
        width:
          type: integer
        height:
          type: integer

    CommentImageResponse:
      type: object
      required: [imageId, displayUrl, thumbUrl, width, height, caption]
      properties:
        imageId:
          type: string
        displayUrl:
          type: string
        thumbUrl:
          type: string
        width:
          type: integer
        height:
          type: integer
        caption:
          type: [string, "null"]

    CommentResponse:
      type: object
      description: >
        One comment (`09-engagement.md` §1.1). Used both on the engagement
        routes and inline in the published newsletter. A soft-deleted comment
        has `deletedAt` set, an empty `body` and a null `image`.
      required: [commentId, authorUserId, displayName, body, image, createdAt, editedAt, deletedAt]
      properties:
        commentId:
          type: string
        authorUserId:
          type: string
        displayName:
          type: string
        body:
          type: string
        image:
          oneOf:
            - $ref: "#/components/schemas/CommentImageResponse"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, "null"]
          format: date-time
        deletedAt:
          type: [string, "null"]
          format: date-time

    CommentListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommentResponse"
        nextCursor:
          type: [string, "null"]

    CreateCommentRequest:
      type: object
      properties:
        body:
          type: string
          maxLength: 2000
        imageMediaId:
          type: [string, "null"]

    PatchCommentRequest:
      type: object
      description: >
        Absent fields are unchanged; `imageMediaId: null` removes the attachment.
      properties:
        body:
          type: string
          maxLength: 2000
        imageMediaId:
          type: [string, "null"]

    ReactionsResponse:
      type: object
      required: [reactionGroups, myReactions]
      properties:
        reactionGroups:
          type: array
          items:
            $ref: "#/components/schemas/ReactionGroupResponse"
        myReactions:
          type: array
          items:
            type: string

    ReactionGroupResponse:
      type: object
      required: [emoji, count, reactedByMe]
      properties:
        emoji:
          type: string
        count:
          type: integer
        reactedByMe:
          type: boolean

    PublishedAnswerResponse:
      type: object
      required: [responseId, userId, displayName, images, publishedAt, comments, reactionGroups]
      properties:
        responseId:
          type: string
        userId:
          type: string
        displayName:
          type: string
        body:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/PublishedImageResponse"
        publishedAt:
          type: string
          format: date-time
        comments:
          type: array
          items:
            $ref: "#/components/schemas/CommentResponse"
        reactionGroups:
          type: array
          items:
            $ref: "#/components/schemas/ReactionGroupResponse"

    PublishedPollOptionResponse:
      type: object
      required: [optionId, label, voteCount]
      properties:
        optionId:
          type: string
        label:
          type: string
        voteCount:
          type: integer

    PublishedQuestionResponse:
      type: object
      required: [questionId, kind, prompt, displayOrder, askedBy, isAnonymous]
      description: Exactly one of `answers` (text) / `options`+`myVoteOptionId` (poll) is present, matching `kind`.
      properties:
        questionId:
          type: string
        kind:
          $ref: "#/components/schemas/QuestionKind"
        prompt:
          type: string
        displayOrder:
          type: integer
        askedBy:
          oneOf:
            - $ref: "#/components/schemas/AskedBy"
            - type: "null"
        isAnonymous:
          type: boolean
        answers:
          type: array
          items:
            $ref: "#/components/schemas/PublishedAnswerResponse"
        options:
          type: array
          items:
            $ref: "#/components/schemas/PublishedPollOptionResponse"
        myVoteOptionId:
          type: string

    NewsletterDetailResponse:
      description: Shape depends on `status`. `archived` is a bare 410, not modeled here.
      oneOf:
        - type: object
          required: [status, candidates]
          properties:
            status:
              type: string
              enum: [voting]
            candidates:
              type: array
              items:
                $ref: "#/components/schemas/CandidateItemResponse"
        - type: object
          required: [status, cycleId, responseOpenAt, responseCloseAt, questions]
          properties:
            status:
              type: string
              enum: [open]
            cycleId:
              type: string
            responseOpenAt:
              type: string
              format: date-time
            responseCloseAt:
              type: string
              format: date-time
            questions:
              type: array
              items:
                $ref: "#/components/schemas/OpenQuestionResponse"
        - type: object
          required: [status, cycleId, responseCloseAt, publishedAt, questions]
          properties:
            status:
              type: string
              enum: [published]
            cycleId:
              type: string
            responseCloseAt:
              type: string
              format: date-time
            publishedAt:
              type: string
              format: date-time
            questions:
              type: array
              items:
                $ref: "#/components/schemas/PublishedQuestionResponse"

    # ---- §7 Response routes (drafts + publish) ----

    ResponseDto:
      type: object
      description: The full shape of a saved response, returned by every §7 route.
      required:
        - responseId
        - userId
        - questionId
        - groupId
        - cycleId
        - kind
        - status
        - imageMediaIds
        - updatedAt
        - publishedAt
      properties:
        responseId:
          type: string
        userId:
          type: string
        questionId:
          type: string
        groupId:
          type: string
        cycleId:
          type: string
        kind:
          $ref: "#/components/schemas/QuestionKind"
        status:
          $ref: "#/components/schemas/ResponseStatus"
        body:
          type: string
        pollOptionId:
          type: string
        imageMediaIds:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time

    MyResponsesList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResponseDto"

    SaveResponseRequest:
      description: >
        Tagged by `kind`. Image captions are set separately via
        `PATCH /uploads/{imageId}` (§9.6), not part of this payload.
      oneOf:
        - type: object
          required: [kind, body, imageMediaIds, publish]
          properties:
            kind:
              type: string
              enum: [text]
            body:
              type: string
            imageMediaIds:
              type: array
              items:
                type: string
            publish:
              type: boolean
        - type: object
          required: [kind, pollOptionId, publish]
          properties:
            kind:
              type: string
              enum: [poll]
            pollOptionId:
              type: string
            publish:
              type: boolean

    # ---- §9 Media routes ----

    ImageMimeType:
      type: string
      enum: [image/jpeg, image/png, image/webp, image/gif]

    AvatarMimeType:
      type: string
      enum: [image/jpeg, image/png, image/webp]

    ImagePurpose:
      type: string
      enum: [response, comment]

    MediaStatus:
      type: string
      enum: [pending, ready, failed]

    CreateUploadRequest:
      type: object
      required: [groupId, cycleId, questionId, mimeType, byteSize]
      properties:
        groupId:
          type: string
        cycleId:
          type: string
        questionId:
          type: string
        purpose:
          description: Defaults to `response` when absent.
          $ref: "#/components/schemas/ImagePurpose"
        mimeType:
          $ref: "#/components/schemas/ImageMimeType"
        byteSize:
          type: integer
          minimum: 1
          maximum: 15728640
        sha256:
          type: string
          description: >
            Optional standard-base64 SHA-256 of the file (44 chars). When sent,
            it is signed into the presign as `x-amz-checksum-sha256`, so S3
            rejects a body that doesn't match.

    CreateUploadResponse:
      type: object
      required: [imageId, uploadUrl, headers, expiresInSeconds]
      properties:
        imageId:
          type: string
        uploadUrl:
          type: string
          format: uri
        headers:
          type: object
          description: >
            Every header the presigned request was signed with. The client must
            send all of them on the PUT, verbatim.
          additionalProperties:
            type: string
        expiresInSeconds:
          type: integer

    ImageMediaResponse:
      type: object
      required:
        - imageId
        - userId
        - groupId
        - cycleId
        - questionId
        - purpose
        - mimeType
        - status
        - bytes
        - width
        - height
        - caption
        - displayUrl
        - thumbUrl
        - errorMessage
        - uploadedAt
        - processedAt
      properties:
        imageId:
          type: string
        userId:
          type: string
        groupId:
          type: string
        cycleId:
          type: string
        questionId:
          type: [string, "null"]
        purpose:
          $ref: "#/components/schemas/ImagePurpose"
        mimeType:
          $ref: "#/components/schemas/ImageMimeType"
        status:
          $ref: "#/components/schemas/MediaStatus"
        bytes:
          type: integer
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        caption:
          type: [string, "null"]
        displayUrl:
          type: [string, "null"]
          description: Absolute CloudFront URL; null until `status=ready`.
        thumbUrl:
          type: [string, "null"]
          description: Absolute CloudFront URL; null until `status=ready`.
        errorMessage:
          type: [string, "null"]
          description: >
            Set when `status=failed`: `IMAGE_TOO_LARGE`, `IMAGE_DECODE_FAILED`
            or `DELETED`.
        uploadedAt:
          type: string
          format: date-time
        processedAt:
          type: [string, "null"]
          format: date-time

    PatchUploadRequest:
      type: object
      required: [caption]
      properties:
        caption:
          type: [string, "null"]
          maxLength: 140
          description: "`null` or an all-whitespace string clears the caption."

    MediaCookieResponse:
      type: object
      required: [policy, signature, keyPairId, expiresAt]
      properties:
        policy:
          type: string
          description: CloudFront-modified base64 of the custom policy JSON.
        signature:
          type: string
          description: CloudFront-modified base64 RSA-SHA1 signature of the policy.
        keyPairId:
          type: string
        expiresAt:
          type: string
          format: date-time

    CreateAvatarRequest:
      type: object
      required: [mimeType, byteSize]
      properties:
        mimeType:
          $ref: "#/components/schemas/AvatarMimeType"
        byteSize:
          type: integer
          minimum: 1
          maximum: 5242880
        sha256:
          type: string
          description: Optional standard-base64 SHA-256, as on `CreateUploadRequest`.

    CreateAvatarResponse:
      type: object
      required: [avatarId, uploadUrl, headers, expiresInSeconds]
      properties:
        avatarId:
          type: string
        uploadUrl:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expiresInSeconds:
          type: integer

    AvatarMediaResponse:
      type: object
      required:
        [avatarId, mimeType, status, bytes, avatarUrl, errorMessage, uploadedAt, processedAt]
      properties:
        avatarId:
          type: string
        mimeType:
          $ref: "#/components/schemas/AvatarMimeType"
        status:
          $ref: "#/components/schemas/MediaStatus"
        bytes:
          type: integer
        avatarUrl:
          type: [string, "null"]
          description: Absolute unsigned CloudFront URL; null until `status=ready`.
        errorMessage:
          type: [string, "null"]
        uploadedAt:
          type: string
          format: date-time
        processedAt:
          type: [string, "null"]
          format: date-time

    # ---- §10 Push ----

    PushSubscriptionKeys:
      type: object
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
          description: base64url uncompressed P-256 public key (65 bytes decoded).
        auth:
          type: string
          description: base64url auth secret (16 bytes decoded).

    PushSubscribeRequest:
      type: object
      description: >
        The browser's `PushSubscription.toJSON()` plus `userAgent`.
        `expirationTime` is accepted and ignored.
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
        expirationTime:
          type: [number, "null"]
        keys:
          $ref: "#/components/schemas/PushSubscriptionKeys"
        userAgent:
          type: string

    PushSubscribeResponse:
      type: object
      required: [subscriptionId]
      properties:
        subscriptionId:
          type: string
          description: base64url (unpadded) sha256 of the endpoint.

    PushUnsubscribeRequest:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string

    PushSubscriptionResponse:
      type: object
      required: [subscriptionId, endpoint, userAgent, createdAt, lastSuccessAt, failureCount]
      properties:
        subscriptionId:
          type: string
        endpoint:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
        failureCount:
          type: integer

    PushSubscriptionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PushSubscriptionResponse"

    PushDeliveryOutcome:
      type: string
      enum: [delivered, expired, failed]

    PushTestResult:
      type: object
      required: [subscriptionId, userAgent, outcome, statusCode]
      properties:
        subscriptionId:
          type: string
        userAgent:
          type: string
        outcome:
          $ref: "#/components/schemas/PushDeliveryOutcome"
        statusCode:
          type: [integer, "null"]

    PushTestResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PushTestResult"

    PutPushPreferenceRequest:
      type: object
      additionalProperties: false
      required: [cycleOpen, deadlineReminders]
      properties:
        cycleOpen:
          type: boolean
        deadlineReminders:
          type: boolean

    PushPreferenceResponse:
      type: object
      required: [groupId, cycleOpen, deadlineReminders]
      properties:
        groupId:
          type: string
        cycleOpen:
          type: boolean
        deadlineReminders:
          type: boolean

    PushPreferenceListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PushPreferenceResponse"

    # ---- §11 Health ----

    HealthResponse:
      type: object
      required: [status, version, buildAt]
      properties:
        status:
          type: string
        version:
          type: string
          description: Short git SHA of the build, or `unknown`.
        buildAt:
          type: [string, "null"]
          format: date-time
