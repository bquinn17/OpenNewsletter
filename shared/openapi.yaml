openapi: 3.1.0

info:
  title: OpenNewsletter API
  version: "1.0.0"
  description: >
    Canonical contract for the OpenNewsletter HTTP API. Hand-maintained; see
    `plans/03-api-contract.md` for the human-readable prose mirror and
    `plans/11-testing-ci-cd.md` §2.3 for the contract test that round-trips every
    example below against `backend/crates/domain/src/api.rs`.

    Routes are added here in the same PR that ships them (`plans/coding-standards.md`
    §8). This file currently covers every route through Milestone 4
    (`plans/03-api-contract.md` §2-§4, §13); Milestone 5 adds the newsletter and
    candidate-question routes (§5-§6) as new tags alongside these; Milestone 8
    adds the media routes (§9); Milestone 10 adds the engagement routes (§8).

servers:
  - url: https://api.opennewsletter.example.com
    description: prod
  - url: https://{apiId}.execute-api.us-east-1.amazonaws.com
    description: dev (no custom domain)
    variables:
      apiId:
        default: example

security:
  - bearerAuth: []

tags:
  - name: bootstrap
    description: Bootstrap / metadata routes (`03-api-contract.md` §2).
  - name: invites
    description: Invite & membership routes (`03-api-contract.md` §3).
  - name: groups
    description: Group routes (`03-api-contract.md` §4).
  - name: newsletters
    description: Newsletter list + detail routes (`03-api-contract.md` §5).
  - name: candidate-questions
    description: Candidate question and vote routes (`03-api-contract.md` §6).
  - name: responses
    description: Response draft/publish routes (`03-api-contract.md` §7).
  - name: engagement
    description: Comment and reaction routes (`03-api-contract.md` §8).
  - name: media
    description: Upload, avatar and signed-cookie routes (`03-api-contract.md` §9).
  - name: push
    description: Web Push subscription, test and preference routes (`03-api-contract.md` §10).
  - name: health
    description: Health check (`03-api-contract.md` §11).

paths:
  /config:
    get:
      operationId: getConfig
      tags: [bootstrap]
      summary: Bootstrap data the SPA needs after login.
      responses:
        "200":
          description: Bootstrap payload. `userId`/`email`/`displayName` are `null` until the caller redeems their first invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
              example:
                userId: null
                email: "quinn@example.com"
                displayName: "Quinn"
                vapidPublicKey: "BPV_example_vapid_public_key"
                groupDefaults: {}
                memberships: []
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /me:
    get:
      operationId: getMe
      tags: [bootstrap]
      summary: The caller's bare User profile (no memberships).
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                userId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                email: "quinn@example.com"
                displayName: "Quinn"
                avatarColor: "teal"
                avatarMediaId: null
                avatarUrl: null
                createdAt: "2026-01-15T18:04:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: patchMe
      tags: [bootstrap]
      summary: Update the caller's profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequest"
            example:
              displayName: "Quinn"
              avatarColor: "teal"
              avatarMediaId: null
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                userId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                email: "quinn@example.com"
                displayName: "Quinn"
                avatarColor: "teal"
                avatarMediaId: null
                avatarUrl: null
                createdAt: "2026-01-15T18:04:00Z"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /admin/invites:
    post:
      operationId: createInvite
      tags: [invites]
      summary: Create an invite for a group. Caller must be an admin of that group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
            example:
              groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
              ttlDays: 7
              roleOnRedeem: "member"
      responses:
        "201":
          description: The created invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInviteResponse"
              example:
                code: "ABCD-EFGH-JKMN-PQRS"
                groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                expiresAt: "2026-02-01T00:00:00Z"
                roleOnRedeem: "member"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /admin/groups/{groupId}/invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List invites for a group. Admin only.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      responses:
        "200":
          description: The group's invites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteListResponse"
              example:
                items:
                  - code: "ABCD-EFGH-JKMN-PQRS"
                    groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                    status: "pending"
                    roleOnRedeem: "member"
                    createdBy: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                    createdAt: "2026-01-25T00:00:00Z"
                    expiresAt: "2026-02-01T00:00:00Z"
                    consumedBy: null
                    consumedAt: null
                nextCursor: null
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/invites/{code}/revoke:
    post:
      operationId: revokeInvite
      tags: [invites]
      summary: Revoke a pending invite. Idempotent.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "ABCD-EFGH-JKMN-PQRS"
      responses:
        "204":
          description: Revoked (or already revoked).
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /invites/redeem:
    post:
      operationId: redeemInvite
      tags: [invites]
      summary: >
        Redeem an invite code. Covers both first signup (lazily creates the
        caller's User row) and an existing user joining another group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
            example:
              code: "ABCD-EFGH-JKMN-PQRS"
      responses:
        "200":
          description: The joined group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResponse"
              example:
                groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                groupName: "Trail Crew"
                role: "member"
        "400":
          $ref: "#/components/responses/InviteInvalid"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/InviteExpired"

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: The caller's memberships (same join `/config` returns).
      responses:
        "200":
          description: The caller's memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipListResponse"
              example:
                memberships:
                  - groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                    role: "admin"
                    groupName: "Trail Crew"
                    timezone: "America/New_York"
                    gradient: "grape-sky"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Full group detail, including members. Caller must be a member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
              example:
                groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                name: "Trail Crew"
                timezone: "America/New_York"
                gradient: "grape-sky"
                cycleSettings:
                  questionsPerCycle: 5
                  votesPerUserPerCycle: 3
                  responseWindowDays: 4
                notificationSettings:
                  offsetsHoursBeforeClose: [96, 48, 24]
                  onCycleOpen: true
                memberCount: 1
                memberSoftCap: 50
                createdAt: "2026-01-01T00:00:00Z"
                members:
                  - userId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                    displayName: "Quinn"
                    role: "admin"
                    avatarColor: "teal"
                    avatarUrl: null
                    joinedAt: "2026-01-01T00:00:00Z"
                    editionsAnswered: 0
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchGroup
      tags: [groups]
      summary: Update group settings. Admin only.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchGroupRequest"
            example:
              gradient: "ocean-dusk"
              cycleSettings:
                questionsPerCycle: 5
                votesPerUserPerCycle: 3
                responseWindowDays: 4
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
              example:
                groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                name: "Trail Crew"
                timezone: "America/New_York"
                gradient: "ocean-dusk"
                cycleSettings:
                  questionsPerCycle: 5
                  votesPerUserPerCycle: 3
                  responseWindowDays: 4
                notificationSettings:
                  offsetsHoursBeforeClose: [96, 48, 24]
                  onCycleOpen: true
                memberCount: 1
                memberSoftCap: 50
                createdAt: "2026-01-01T00:00:00Z"
                members:
                  - userId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                    displayName: "Quinn"
                    role: "admin"
                    avatarColor: "teal"
                    avatarUrl: null
                    joinedAt: "2026-01-01T00:00:00Z"
                    editionsAnswered: 0
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /groups/{groupId}/members/{userId}:
    delete:
      operationId: removeMember
      tags: [groups]
      summary: Leave (self) or kick (admin) a member. The last admin can't leave.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "204":
          description: Removed.
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchMember
      tags: [groups]
      summary: Change a member's role. Admin only.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMemberRequest"
            example:
              role: "admin"
      responses:
        "200":
          description: The member's updated profile within the group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
              example:
                userId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                displayName: "Quinn"
                role: "admin"
                avatarColor: "teal"
                avatarUrl: null
                joinedAt: "2026-01-01T00:00:00Z"
                editionsAnswered: 0
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"

  /groups/{groupId}/newsletters:
    get:
      operationId: listNewsletters
      tags: [newsletters]
      summary: Past + current + upcoming newsletters for the group, newest first. Caller must be a member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/NewsletterStatusQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
      responses:
        "200":
          description: A page of newsletters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterListResponse"
              example:
                items:
                  - cycleId: "202606"
                    status: "open"
                    responseOpenAt: "2026-06-01T00:00:00Z"
                    responseCloseAt: "2026-06-05T00:00:00Z"
                    publishedAt: null
                    questionCount: 5
                    myDraftCount: 2
                    myPublishedCount: 0
                nextCursor: null
        "403":
          $ref: "#/components/responses/Forbidden"

  /groups/{groupId}/newsletters/{cycleId}:
    get:
      operationId: getNewsletter
      tags: [newsletters]
      summary: >
        The full edition. Shape depends on `status` — see `NewsletterDetailResponse`.
        `archived` returns 410 instead of a body (`06-newsletter-lifecycle.md` §1;
        not reachable until archival ships).
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
      responses:
        "200":
          description: The edition, shaped per its current `status`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterDetailResponse"
              example:
                cycleId: "202606"
                status: "published"
                responseCloseAt: "2026-06-05T00:00:00Z"
                publishedAt: "2026-06-05T00:00:01Z"
                questions:
                  - questionId: "018f2b6b-6c1b-7c3a-9d4e-3c4d5e6f7a8b"
                    kind: "text"
                    prompt: "What's your favorite hike of the year?"
                    displayOrder: 0
                    askedBy:
                      userId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                      displayName: "Kari"
                      avatarColor: "teal"
                      avatarUrl: null
                    isAnonymous: false
                    answers:
                      - responseId: "018f2b6b-6c1b-7c3a-9d4e-4d5e6f7a8b9c"
                        userId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                        displayName: "Quinn"
                        body: "Lake 22, hands down."
                        images: []
                        publishedAt: "2026-06-03T12:00:00Z"
                        comments: []
                        reactionGroups:
                          - emoji: "🔥"
                            count: 3
                            reactedByMe: true
                  - questionId: "018f2b6b-6c1b-7c3a-9d4e-5e6f7a8b9c0d"
                    kind: "poll"
                    prompt: "Which trail had the best views?"
                    displayOrder: 1
                    askedBy: null
                    isAnonymous: true
                    options:
                      - optionId: "018f2b6b-6c1b-7c3a-9d4e-6f7a8b9c0d1e"
                        label: "Mt Si"
                        voteCount: 4
                      - optionId: "018f2b6b-6c1b-7c3a-9d4e-7a8b9c0d1e2f"
                        label: "Lake 22"
                        voteCount: 7
                    myVoteOptionId: "018f2b6b-6c1b-7c3a-9d4e-7a8b9c0d1e2f"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/NewsletterArchived"

  /groups/{groupId}/candidate-questions:
    get:
      operationId: listCandidateQuestions
      tags: [candidate-questions]
      summary: The candidate pool for the group's next (currently `voting`) cycle. Caller must be a member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CandidateSortQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
      responses:
        "200":
          description: The candidate pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateListResponse"
              example:
                nextCycleId: "202606"
                votesPerUserPerCycle: 3
                myVoteCount: 2
                items:
                  - questionId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                    kind: "text"
                    prompt: "What's the best trail you hiked this summer?"
                    askedBy:
                      userId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                      displayName: "Kari"
                      avatarColor: "teal"
                      avatarUrl: null
                    isAnonymous: false
                    voteCount: 7
                    votedByMe: true
                    submittedAt: "2026-05-20T00:00:00Z"
                  - questionId: "018f2b6b-6c1b-7c3a-9d4e-3c4d5e6f7a8b"
                    kind: "poll"
                    prompt: "Which trailhead should we carpool from?"
                    pollOptions:
                      - optionId: "018f2b6b-6c1b-7c3a-9d4e-4d5e6f7a8b9c"
                        label: "North lot"
                      - optionId: "018f2b6b-6c1b-7c3a-9d4e-5e6f7a8b9c0d"
                        label: "South lot"
                    askedBy: null
                    isAnonymous: true
                    voteCount: 5
                    votedByMe: false
                    submittedAt: "2026-05-21T00:00:00Z"
                nextCursor: null
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      operationId: createCandidateQuestion
      tags: [candidate-questions]
      summary: Suggest a candidate question for the group's next `voting` cycle. Caller must be a member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCandidateRequest"
            example:
              kind: "text"
              prompt: "What's your favorite hike of the year?"
              isAnonymous: false
      responses:
        "201":
          description: The created candidate, with `askedBy` populated (the submitter always sees their own attribution).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateItemResponse"
              example:
                questionId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                kind: "text"
                prompt: "What's your favorite hike of the year?"
                askedBy:
                  userId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                  displayName: "Quinn"
                  avatarColor: "teal"
                  avatarUrl: null
                isAnonymous: false
                voteCount: 0
                votedByMe: false
                submittedAt: "2026-05-22T00:00:00Z"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /groups/{groupId}/candidate-questions/{questionId}/votes:
    post:
      operationId: castCandidateVote
      tags: [candidate-questions]
      summary: Cast an upvote. Idempotent — re-posting returns 200 with the current state. Caller must be a member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
      responses:
        "200":
          description: The candidate's updated vote state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateVoteResponse"
              example:
                questionId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                voteCount: 8
                votedByMe: true
                myVoteCount: 3
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: withdrawCandidateVote
      tags: [candidate-questions]
      summary: Withdraw the caller's upvote. Idempotent. Caller must be a member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
      responses:
        "200":
          description: The candidate's updated vote state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateVoteResponse"
              example:
                questionId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                voteCount: 7
                votedByMe: false
                myVoteCount: 2
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/groups/{groupId}/candidate-questions/{questionId}:
    delete:
      operationId: adminDeleteCandidateQuestion
      tags: [candidate-questions]
      summary: >
        Delete a candidate while it's still in `voting` (cascades its votes).
        Admin only. There is no admin curate/promote surface (`06-newsletter-lifecycle.md` §7).
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /groups/{groupId}/newsletters/{cycleId}/my-responses:
    get:
      operationId: listMyResponses
      tags: [responses]
      summary: The caller's drafts/publishes for this cycle. Caller must be a member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
      responses:
        "200":
          description: The caller's responses in this cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyResponsesList"
              example:
                items:
                  - responseId: "018f2b6b-6c1b-7c3a-9d4e-8b9c0d1e2f3a"
                    userId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                    questionId: "018f2b6b-6c1b-7c3a-9d4e-3c4d5e6f7a8b"
                    groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                    cycleId: "202606"
                    kind: "text"
                    status: "draft"
                    body: "Lake 22, hands down."
                    imageMediaIds: []
                    updatedAt: "2026-06-02T10:00:00Z"
                    publishedAt: null
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/NewsletterArchived"

  /groups/{groupId}/newsletters/{cycleId}/questions/{questionId}/my-response:
    get:
      operationId: getMyResponse
      tags: [responses]
      summary: >
        The caller's draft/published answer to one question. 404 if none
        exists yet. Caller must be a member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
      responses:
        "200":
          description: The caller's response to this question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseDto"
              example:
                responseId: "018f2b6b-6c1b-7c3a-9d4e-8b9c0d1e2f3a"
                userId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                questionId: "018f2b6b-6c1b-7c3a-9d4e-3c4d5e6f7a8b"
                groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                cycleId: "202606"
                kind: "text"
                status: "draft"
                body: "Lake 22, hands down."
                imageMediaIds: []
                updatedAt: "2026-06-02T10:00:00Z"
                publishedAt: null
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/NewsletterArchived"
    put:
      operationId: saveMyResponse
      tags: [responses]
      summary: >
        Save a draft or publish an answer. Last-write-wins on content — no
        version tokens, no conflict errors. Publishing is sticky: once
        published, a later `publish=false` save keeps the new content but
        cannot unpublish (`03-api-contract.md` §7.3). Caller must be a member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveResponseRequest"
            example:
              kind: "text"
              body: "Lake 22, hands down."
              imageMediaIds: []
              publish: false
      responses:
        "200":
          description: The saved response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseDto"
              example:
                responseId: "018f2b6b-6c1b-7c3a-9d4e-8b9c0d1e2f3a"
                userId: "018f2b6b-6c1b-7c3a-9d4e-1a2b3c4d5e6f"
                questionId: "018f2b6b-6c1b-7c3a-9d4e-3c4d5e6f7a8b"
                groupId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f7a"
                cycleId: "202606"
                kind: "text"
                status: "draft"
                body: "Lake 22, hands down."
                imageMediaIds: []
                updatedAt: "2026-06-02T10:00:00Z"
                publishedAt: null
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/NewsletterArchived"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /groups/{groupId}/newsletters/{cycleId}/questions/{questionId}/responses/{responseId}/comments:
    get:
      operationId: listComments
      tags: [engagement]
      summary: >
        Comments on one published text answer, oldest first (AP18). Soft-deleted
        comments are included as placeholders (`deletedAt` set, `body` empty,
        `image` null) so ordering is preserved. Cycle must be `published`
        (409 `CYCLE_NOT_PUBLISHED`). 404 when the response is missing, not
        published, or a poll answer. Caller must be a member. Default page
        size 50.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
        - $ref: "#/components/parameters/ResponseIdPath"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
      responses:
        "200":
          description: A page of comments, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
              example:
                items:
                  - commentId: "018f2b6b-6c1b-7c3a-9d4e-9c0d1e2f3a4b"
                    authorUserId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f70"
                    displayName: "Alex"
                    body: "Same — the switchbacks are brutal."
                    image: null
                    createdAt: "2026-06-05T09:00:00Z"
                    editedAt: null
                    deletedAt: null
                nextCursor: null
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/NewsletterArchived"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createComment
      tags: [engagement]
      summary: >
        Comment on a published text answer. `body` 0-2000 chars; optional
        `imageMediaId` must be a `ready` image owned by the caller, uploaded
        for this group, cycle and question with `purpose: "comment"`, and not
        already attached to another comment. At least one of a non-whitespace
        `body` or an image is required (`09-engagement.md` §1.3). Caller must
        be a member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
        - $ref: "#/components/parameters/ResponseIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
            example:
              body: "Same — the switchbacks are brutal."
              imageMediaId: null
      responses:
        "201":
          description: The created comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
              example:
                commentId: "018f2b6b-6c1b-7c3a-9d4e-9c0d1e2f3a4b"
                authorUserId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f70"
                displayName: "Alex"
                body: "Same — the switchbacks are brutal."
                image:
                  imageId: "018f2b6b-6c1b-7c3a-9d4e-ad1e2f3a4b5c"
                  displayUrl: "https://cdn.opennewsletter.example.com/img/g/202606/display.webp"
                  thumbUrl: "https://cdn.opennewsletter.example.com/img/g/202606/thumb.webp"
                  width: 1200
                  height: 800
                  caption: null
                createdAt: "2026-06-05T09:00:00Z"
                editedAt: null
                deletedAt: null
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/NewsletterArchived"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /groups/{groupId}/newsletters/{cycleId}/questions/{questionId}/responses/{responseId}/comments/{commentId}:
    patch:
      operationId: patchComment
      tags: [engagement]
      summary: >
        Edit one's own comment (author only — admins cannot edit others'; 403).
        An absent field is left unchanged; `"imageMediaId": null` removes the
        attachment. The result must still have a non-whitespace body or an
        image. Sets `editedAt`. 404 for a missing or soft-deleted comment.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
        - $ref: "#/components/parameters/ResponseIdPath"
        - $ref: "#/components/parameters/CommentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCommentRequest"
            example:
              body: "Same — the switchbacks are brutal. Worth it though."
      responses:
        "200":
          description: The updated comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
              example:
                commentId: "018f2b6b-6c1b-7c3a-9d4e-9c0d1e2f3a4b"
                authorUserId: "018f2b6b-6c1b-7c3a-9d4e-2b3c4d5e6f70"
                displayName: "Alex"
                body: "Same — the switchbacks are brutal. Worth it though."
                image: null
                createdAt: "2026-06-05T09:00:00Z"
                editedAt: "2026-06-05T09:10:00Z"
                deletedAt: null
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/NewsletterArchived"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteComment
      tags: [engagement]
      summary: >
        Soft delete: sets `deletedAt`, blanks `body`, drops the image
        attachment. Author or group admin. Idempotent — 204 for an
        already-deleted comment, 404 for a missing one.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
        - $ref: "#/components/parameters/ResponseIdPath"
        - $ref: "#/components/parameters/CommentIdPath"
      responses:
        "204":
          description: Deleted (or already deleted).
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/NewsletterArchived"

  /groups/{groupId}/newsletters/{cycleId}/questions/{questionId}/responses/{responseId}/reactions:
    get:
      operationId: listReactions
      tags: [engagement]
      summary: >
        Grouped reactions on one published text answer (AP19), plus the
        caller's own emoji. Groups are ordered by count descending, then by
        their earliest reaction. Cycle must be `published`. Caller must be a
        member.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
