                  - emoji: "🤣"
                    count: 2
                    reactedByMe: false
                myReactions: ["🔥"]
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/NewsletterArchived"

  /groups/{groupId}/newsletters/{cycleId}/questions/{questionId}/responses/{responseId}/reactions/{emoji}:
    put:
      operationId: putReaction
      tags: [engagement]
      summary: >
        Idempotently add the caller's reaction. `emoji` is URL-encoded,
        NFC-normalized, 1-12 codepoints with at least one
        `Extended_Pictographic` or regional-indicator codepoint
        (`09-engagement.md` §2.2); otherwise 422. No request body. Returns
        the answer's reactions after the change.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
        - $ref: "#/components/parameters/ResponseIdPath"
        - $ref: "#/components/parameters/EmojiPath"
      responses:
        "200":
          description: The answer's reactions after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionsResponse"
              example:
                reactionGroups:
                  - emoji: "🔥"
                    count: 5
                    reactedByMe: true
                myReactions: ["🔥"]
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/NewsletterArchived"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteReaction
      tags: [engagement]
      summary: >
        Idempotently remove the caller's reaction with this emoji. Same emoji
        validation as PUT. Returns the answer's reactions after the change.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/CycleIdPath"
        - $ref: "#/components/parameters/QuestionIdPath"
        - $ref: "#/components/parameters/ResponseIdPath"
        - $ref: "#/components/parameters/EmojiPath"
      responses:
        "200":
          description: The answer's reactions after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionsResponse"
              example:
                reactionGroups:
                  - emoji: "🔥"
                    count: 4
                    reactedByMe: false
                myReactions: []
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/NewsletterArchived"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /uploads:
    post:
      operationId: createUpload
      tags: [media]
      summary: >
        Request a presigned S3 PUT URL for a response or comment image
