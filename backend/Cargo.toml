[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/persistence",
    "crates/shared",
    "crates/media-delete",
    "crates/media-urls",
    "crates/lambda-invites",
    "crates/lambda-groups",
    "crates/lambda-newsletters",
    "crates/lambda-questions",
    "crates/lambda-responses",
    "crates/lambda-engagement",
    "crates/lambda-media",
    "crates/lambda-push",
    "crates/lambda-image-process",
    "crates/lambda-cycle-tick",
    "crates/lambda-notify-tick",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The SDK crates' defaults minus `rustls`, which only compiles in the legacy
# hyper 0.14 / rustls 0.21 client. Every `load_defaults` passes
# `BehaviorVersion::latest()`, so the client actually used is
# `default-https-client` (hyper 1 / rustls 0.23); dropping `rustls` keeps the
# unused, unpatched rustls 0.21 out of the dependency tree (`deny.toml`).
# S3 also drops `sigv4a`: SigV4a only signs requests to Multi-Region Access
# Points, which nothing here uses (presigned URLs and object calls are plain
# SigV4 on regular buckets), and it pulls in crypto-bigint 0.5, whose
# RUSTSEC-2026-0387 has no fix on the 0.5 line that aws-sigv4 still requires.
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "http-1x"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_dynamo = { version = "4.2", features = ["aws-sdk-dynamodb+1"] }
thiserror = "1"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
chrono-tz = "0.9"
async-trait = "0.1"
futures = "0.3"
pretty_assertions = "1"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["dynamodb"] }
lambda_runtime = "1"
lambda_http = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
once_cell = "1"
dashmap = "6"
rand = "0.8"
base64 = "0.22"
