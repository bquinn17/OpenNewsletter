[package]
name = "domain"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
# Emoji reaction validation (`09-engagement.md` §2.2): NFC normalization plus an
# Extended_Pictographic / regional-indicator codepoint check. Both are small,
# maintained unicode-rs crates with no further dependencies.
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["emoji"] }

[dev-dependencies]
# Dev-dependency cycle (domain -> shared -> domain) is fine: Cargo only resolves
# dev-dependencies for this crate's own tests, never as part of `shared`'s normal
# build graph. Used by `tests/openapi_contract.rs` to check the gradient/avatarColor
# enums against `shared::config`, since `domain` can't take it as a normal dependency
# (`shared` already depends on `domain`).
shared = { path = "../shared" }
serde_yaml = "0.9"
pretty_assertions.workspace = true
