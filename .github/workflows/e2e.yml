# Trigger: nightly at 07:00 UTC, or a manual dispatch.
# Purpose: run the Playwright golden-path suite. With E2E_BASE_URL unset, the
# Playwright config builds a mock-mode app and serves it itself for a fast,
# backend-free run; set it (plus E2E_USERNAME/E2E_PASSWORD) to point the suite
# at a real dev stack instead — those dev-stack-only tests skip when the
# credentials are empty.
name: e2e

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
