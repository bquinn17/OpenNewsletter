# Trigger: pull requests and pushes to main that touch backend/**,
# shared/openapi.yaml (the contract test), rust-toolchain.toml, or this
# workflow file.
# Purpose: fmt, clippy, cargo-deny, the full test suite (including the
# DynamoDB-Local-backed integration tests) and a Lambda
# build sanity check — the PR gate for anything under backend/.
name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/openapi.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/openapi.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The integration tests share one in-memory DynamoDB Local and each
    # creates its own table in it (`persistence::test_factories::make_test_repo`).
    # The image's default command already runs it with `-inMemory`, and the
    # tests' default endpoint is http://127.0.0.1:8000.
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.0.0
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup on ubuntu-latest reads ../rust-toolchain.toml (repo root) and
      # installs/pins the toolchain it names — no dtolnay/rust-toolchain step.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny

      - run: cargo deny check

      # There is no `integration` feature flag: this single `cargo test` runs
      # the unit, contract and DynamoDB-Local integration suites together,
      # against the `dynamodb-local` service above.
      - run: cargo test --workspace

      # ubuntu-latest's system Python refuses `pip install` (PEP 668).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - run: cargo lambda build --release --arm64
