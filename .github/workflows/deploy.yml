# Trigger: every push to main.
# Purpose: deploy the backend to dev and publish the dev frontend to this
# repo's gh-pages (docs/development/testing-and-ci.md §6.4). The Lambdas are
# built once, here, and uploaded as an artifact; release.yml deploys that exact
# artifact to prod when the same SHA is pushed to `release`, so what reaches
# prod is what ran in dev. Backend before frontend, always from one SHA: API
# changes are expand → contract (docs/development/coding-standards.md §8).
# Inert until the repo variable DEPLOY_ENABLED is "true". AWS access is GitHub
# OIDC into CiStack's GithubDeployRole (infra/opennewsletter/ci_stack.py) — no
# long-lived AWS keys in this repo.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never run two dev deploys at once, and never cancel one halfway through a
# CloudFormation update; a newer push queues behind the running one. Prod
# deploys have their own group (release.yml) and touch disjoint stacks.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  dev:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write # peaceiris/actions-gh-pages pushes the gh-pages branch
    # Read by infra/opennewsletter/config.py (EnvConfig). Dev's values are the
    # DEV_-prefixed repo variables, so dev can never silently pick up a prod
    # value; prod's are unprefixed (see .github/workflows/README.md). These
    # are resource identifiers, not credentials, so they're Variables.
    env:
      ROOT_DOMAIN: ${{ vars.DEV_ROOT_DOMAIN }}
      API_DOMAIN: ${{ vars.DEV_API_DOMAIN }}
      HOSTED_ZONE_ID: ${{ vars.DEV_HOSTED_ZONE_ID }}
      HOSTED_ZONE_NAME: ${{ vars.DEV_HOSTED_ZONE_NAME }}
      COGNITO_DOMAIN_PREFIX: ${{ vars.DEV_COGNITO_DOMAIN_PREFIX }}
      APP_SECRET_ARN: ${{ vars.DEV_APP_SECRET_ARN }}
      # Account-wide (CiStack's budget), so the same value for prod (release.yml).
      ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without the ARN config.py falls back to a placeholder and the deploy
      # fails late, inside CloudFormation. ROOT_DOMAIN is also the dev
      # frontend's GitHub Pages domain (its CNAME, below).
      - name: Check dev config
        run: |
          missing=0
          if [ -z "$APP_SECRET_ARN" ]; then
            echo "::error::Repo variable DEV_APP_SECRET_ARN is not set."
            missing=1
          fi
          if [ -z "$ROOT_DOMAIN" ]; then
            echo "::error::Repo variable DEV_ROOT_DOMAIN is not set."
            missing=1
          fi
          exit "$missing"

      # The release build takes ~7 minutes even with a warm rust-cache, so a
      # push that doesn't touch the backend reuses the binaries built for the
      # same sources. Keyed before rust-cache restores backend/target, and
      # with target excluded anyway. Identical binaries also mean CDK sees no
      # Lambda code change. `GET /healthz` then reports the commit the
      # binaries were built at (docs/design/api.md §11.1).
      - name: Restore Lambda binaries built from these sources
        id: lambda-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/target/lambda
          key: lambda-binaries-${{ hashFiles('backend/**', '!backend/target/**', 'rust-toolchain.toml') }}

      # rustup on ubuntu-latest reads rust-toolchain.toml (repo root) and
      # installs/pins the toolchain it names.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.lambda-build.outputs.cache-hit != 'true'
        with:
          workspaces: backend

      # ubuntu-latest's system Python refuses `pip install` (PEP 668).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # cargo-lambda's PyPI package bundles zig, which it uses as the arm64
      # cross-linker.
      - name: Install cargo-lambda
        if: steps.lambda-build.outputs.cache-hit != 'true'
        run: pip install cargo-lambda

      - name: Build Lambda binaries
        if: steps.lambda-build.outputs.cache-hit != 'true'
        working-directory: backend
        env:
          # Compiled into `GET /healthz` (lambda-groups), as `make build-lambdas` does.
          BUILD_SHA: ${{ github.sha }}
        run: |
          BUILD_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_AT
          cargo lambda build --release --arm64

      # CDK silently falls back to a shell stub for a missing binary
      # (infra/opennewsletter/lambda_assets.py), so check before packaging.
      - name: Check every Lambda binary was built
        run: ./scripts/check_lambda_binaries.sh

      # Only after the check, so a partial build is never reused.
      - name: Save Lambda binaries for the next push with these sources
        if: steps.lambda-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/target/lambda
          key: ${{ steps.lambda-build.outputs.cache-primary-key }}

      # A tarball, because upload-artifact drops the executable bit that
      # Lambda needs on `bootstrap`.
      - name: Package Lambda binaries
        run: tar -czf lambda-binaries.tgz -C backend/target lambda

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-binaries
          path: lambda-binaries.tgz
          if-no-files-found: error
          # release.yml deploys this artifact, so this is how far a release
          # may trail main.
          retention-days: 30

      - run: pip install -r infra/requirements.txt

      # Needed for `npx aws-cdk@2` and the frontend build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Backend first: the frontend below may depend on what this ships.
      # --all includes the account-wide CiStack; release.yml leaves it out.
      # --concurrency deploys stacks that don't depend on each other side by
      # side; CDK still orders dependent ones (MonitoringStack's SSM read of
      # ApiStack is an explicit dependency, infra/app.py).
      - name: cdk deploy (dev)
        working-directory: infra
        run: >-
          npx aws-cdk@2 deploy --context env=dev --all --require-approval never
          --concurrency 4 --outputs-file cdk.out/dev-outputs.json

      # The dev build's API, Cognito and media values come straight from the
      # stacks just deployed, as `make deploy-dev` does locally, so they can't
      # drift from what's running. --strict fails here rather than publishing
      # a site with an empty endpoint.
      - name: Write frontend/.env.dev from the stack outputs
        run: python3 scripts/write_frontend_env.py --env dev --strict

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # The env var overrides .env.dev's localhost redirect, which is for `make fe`.
      - name: Build frontend (dev)
        working-directory: frontend
        run: npm run build -- --mode dev
        env:
          VITE_REDIRECT_URI: https://${{ vars.DEV_ROOT_DOMAIN }}/auth/callback
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Write GitHub Pages CNAME
        working-directory: frontend
        run: echo "$ROOT_DOMAIN" > dist/CNAME

      - name: SPA fallback for deep links (docs/design/frontend.md §14.5)
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      # This repo's GitHub Pages site serves dev; prod has its own Pages repo
      # (release.yml), since a repo hosts only one Pages site.
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist

      # Later: run the Playwright `dev` project here (docs/development/testing-and-ci.md §6.4 step 4).
