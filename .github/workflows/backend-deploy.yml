# Trigger: pushes to main that touch backend/** or infra/**, or a manual
# dispatch with a target env (dev|prod, default prod).
# Purpose: build the Lambda binaries and `cdk deploy` them. Inert until the
# repo variable BACKEND_DEPLOY_ENABLED is "true". Assumes the GithubDeployRole
# from infra/opennewsletter/ci_stack.py via GitHub OIDC — no long-lived AWS
# keys in this repo.
name: backend-deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        type: choice
        options: [dev, prod]
        default: prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.BACKEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.event.inputs.env || 'prod' }}
      # Read by infra/opennewsletter/config.py (EnvConfig); these are resource
      # identifiers (domains, ARNs of out-of-band Secrets Manager secrets),
      # not credential material, so they're repo Variables, not Secrets.
      ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
      COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      GOOGLE_OAUTH_SECRET_ARN: ${{ vars.GOOGLE_OAUTH_SECRET_ARN }}
      FACEBOOK_OAUTH_SECRET_ARN: ${{ vars.FACEBOOK_OAUTH_SECRET_ARN }}
      VAPID_SECRET_ARN: ${{ vars.VAPID_SECRET_ARN }}
      CDN_SIGNING_SECRET_ARN: ${{ vars.CDN_SIGNING_SECRET_ARN }}
      ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # ubuntu-latest's system Python refuses `pip install` (PEP 668).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # cargo-lambda's PyPI package bundles zig, which it uses as the arm64
      # cross-linker.
      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - name: Build Lambda binaries
        working-directory: backend
        run: cargo lambda build --release --arm64

      - run: pip install -r infra/requirements.txt

      # Needed for `npx aws-cdk@2`.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: cdk deploy
        working-directory: infra
        run: npx aws-cdk@2 deploy --context "env=$DEPLOY_ENV" --all --require-approval never
