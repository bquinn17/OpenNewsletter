# Trigger: pull requests and pushes to main that touch frontend/**,
# shared/openapi.yaml (the generated api.ts contract), or this workflow file.
# Purpose: lint, type-check, test and build the frontend — the PR gate for
# anything under frontend/.
name: frontend-ci

on:
  pull_request:
    paths:
      - "frontend/**"
      - "shared/openapi.yaml"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "shared/openapi.yaml"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npx eslint .

      - run: npx prettier --check .

      - run: npm run test:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn

      - run: npm run build
