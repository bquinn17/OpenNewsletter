# Trigger: pushes to main that touch frontend/**, or a manual dispatch.
# Purpose: build the production frontend and publish dist/ to the gh-pages
# branch. Inert until the repo variable FRONTEND_DEPLOY_ENABLED is "true"
# (flipped on in M14 once the dev/prod stacks exist to point the build at).
name: frontend-deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    if: vars.FRONTEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_CDN_BASE_URL: ${{ secrets.VITE_CDN_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_BOOTSTRAP_CLIENT_ID: ${{ secrets.VITE_COGNITO_BOOTSTRAP_CLIENT_ID }}
          VITE_COGNITO_HOSTED_DOMAIN: ${{ secrets.VITE_COGNITO_HOSTED_DOMAIN }}
          VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI }}
          VITE_ENV: prod
          VITE_USE_MOCKS: "false"
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Write GitHub Pages CNAME
        run: echo "${{ vars.FRONTEND_DOMAIN }}" > dist/CNAME

      - name: SPA fallback for deep links (04-frontend-architecture.md §14.5)
        run: cp dist/index.html dist/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
